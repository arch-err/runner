name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: https://github.com/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Test
        run: go test -race -timeout 120s ./...
      - name: Build release binaries
        run: bash scripts/release.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: https://code.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: dist/release
          release-notes: 'Standalone binaries for Linux, macOS and Windows. SHA256SUMS contains checksums. Windows binaries are cross-built; native Windows runtime verification is still needed.'
