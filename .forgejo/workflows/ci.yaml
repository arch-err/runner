name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: k8s
    container:
      image: docker.io/library/golang:1.26.4-bookworm@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b
    env:
      GOCACHE: /tmp/go-cache
      GOPATH: /tmp/go
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Fetch offline dependencies
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          version=$(sha256sum go.sum | cut -d ' ' -f1)
          curl --fail --silent --show-error --location "$GITHUB_SERVER_URL/api/packages/arch-err/generic/runner-deps/$version/vendor.tar.gz" -o /tmp/vendor.tar.gz
          echo "$(cat .forgejo/vendor.sha256)  /tmp/vendor.tar.gz" | sha256sum --check
          tar -xzf /tmp/vendor.tar.gz
      - name: Check formatting and vet
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          test -z "$(gofmt -l cmd internal scripts/publish.go)"
          go vet ./...
      - name: Test
        run: |
          cd "$GITHUB_WORKSPACE"
          go test -race -timeout 120s ./...
      - name: Build release binaries
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/release.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          go run scripts/publish.go
