name: Publish releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Match the pinned Go image used by Forgejo CI.
          go-version: '1.26.4'
          cache: false
      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" == v* ]]
          go mod vendor
          export GOFLAGS=-mod=vendor
          go test -race -timeout 120s ./...
          bash scripts/release.sh
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          printf 'Standalone binaries for Linux, macOS and Windows. SHA256SUMS contains checksums.\n\nSource: https://git.3rr.dev/arch-err/runner/releases/tag/%s\n\nWindows binaries are cross-built; native Windows runtime verification is still needed.\n' "$TAG" > release-notes.md
          prerelease=false
          [[ "$TAG" != *-* ]] || prerelease=true
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file release-notes.md --draft \
              --prerelease="$prerelease"
          fi
          gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease="$prerelease" --notes-file release-notes.md
