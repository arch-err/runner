name: Mirror releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Forgejo release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download published Forgejo release
        shell: python
        run: |
          import hashlib, json, os, pathlib, time, urllib.error, urllib.parse, urllib.request

          tag = os.environ['TAG']
          if not tag.startswith('v'):
              raise SystemExit('Expected a version tag starting with v')
          base = 'https://git.3rr.dev/arch-err/runner/releases/download/' + urllib.parse.quote(tag, safe='') + '/'
          api = 'https://git.3rr.dev/api/v1/repos/arch-err/runner/releases/tags/' + urllib.parse.quote(tag, safe='')
          # Git tags reach GitHub before the Forgejo build finishes publishing.
          for attempt in range(120):
              try:
                  with urllib.request.urlopen(api, timeout=30) as response:
                      release = json.load(response)
                  if not release['draft']:
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 502, 503, 504):
                      raise
              if attempt == 119:
                  raise SystemExit('Forgejo release was not published within 20 minutes')
              time.sleep(10)
          pathlib.Path('release-notes.md').write_text(release['body'] + '\n\nSource: ' + release['html_url'] + '\n')
          pathlib.Path('prerelease.txt').write_text(str(release['prerelease']).lower())
          output = pathlib.Path('dist')
          output.mkdir()
          sums = urllib.request.urlopen(base + 'SHA256SUMS', timeout=60).read()
          (output / 'SHA256SUMS').write_bytes(sums)
          expected = {'runner-' + system + '-' + arch + ('.exe' if system == 'windows' else '')
                      for system in ('linux', 'darwin', 'windows') for arch in ('amd64', 'arm64')}
          entries = [line.split() for line in sums.decode().splitlines()]
          if len(entries) != 6 or {entry[1] for entry in entries} != expected:
              raise SystemExit('Unexpected release checksum manifest')
          for checksum, name in entries:
              data = urllib.request.urlopen(base + name, timeout=120).read()
              if hashlib.sha256(data).hexdigest() != checksum:
                  raise SystemExit('Checksum mismatch: ' + name)
              (output / name).write_bytes(data)
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file release-notes.md --draft \
              --prerelease="$(cat prerelease.txt)"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease="$(cat prerelease.txt)" --notes-file release-notes.md
